server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:mem:vrmsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
vrms.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-this-to-a-long-random-production-secret-123456}
vrms.jwt.expiration-ms=86400000
